<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><rect width="1500" height="900" fill="#FBFAFF"/><rect width="1500" height="120" fill="#5645E8"/><text x="54" y="76" class="head">SFU SIAT — Faculty and research labs</text><text x="54" y="175" class="tag">OFFICIAL WEB EXCERPT</text><text x="54" y="205" class="body">Research areas include interactive computing, media, design, people</text><text x="54" y="253" class="body">and the science of interaction. Faculty projects cover HCI, tangible</text><text x="54" y="301" class="body">interfaces, virtual reality, game design, visual analytics,</text><text x="54" y="349" class="body">participatory design and digital curation.</text><text x="54" y="419" class="body">Labs such as cLab, Everyday Design Studio, iSpace, VVISE and Making</text><text x="54" y="467" class="body">Culture Lab connect student work with research practice.</text><line x1="54" y1="760" x2="1446" y2="760" stroke="#D8D0EF" stroke-width="2"/><text x="54" y="800" class="url">Source: https://www.sfu.ca/siat/research/themes.html</text><style>.head{font-family:Arial,sans-serif;font-size:38px;font-weight:700;fill:#fff}.tag{font-family:Arial,sans-serif;font-size:22px;font-weight:700;fill:#5645E8}.body{font-family:Arial,sans-serif;font-size:31px;fill:#202020}.url{font-family:Arial,sans-serif;font-size:20px;fill:#625E76}</style></svg>