<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><rect width="1500" height="900" fill="#FBFAFF"/><rect width="1500" height="120" fill="#5645E8"/><text x="54" y="76" class="head">York Digital Media — Program overview</text><text x="54" y="175" class="tag">OFFICIAL WEB EXCERPT</text><text x="54" y="205" class="body">Digital Media combines creative expression with technology. After an</text><text x="54" y="253" class="body">18-month common core, students choose Digital Media Development,</text><text x="54" y="301" class="body">Digital Media Arts or Digital Media Game Arts.</text><text x="54" y="371" class="body">Projects can include games, immersive and 3D environments, mixed</text><text x="54" y="419" class="body">reality, digital performance, physical computing, IoT and data</text><text x="54" y="467" class="body">visualization.</text><line x1="54" y1="760" x2="1446" y2="760" stroke="#D8D0EF" stroke-width="2"/><text x="54" y="800" class="url">Source: https://ampd.yorku.ca/department-of-computational-arts/digital-media/</text><style>.head{font-family:Arial,sans-serif;font-size:38px;font-weight:700;fill:#fff}.tag{font-family:Arial,sans-serif;font-size:22px;font-weight:700;fill:#5645E8}.body{font-family:Arial,sans-serif;font-size:31px;fill:#202020}.url{font-family:Arial,sans-serif;font-size:20px;fill:#625E76}</style></svg>