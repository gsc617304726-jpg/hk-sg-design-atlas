<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><rect width="1500" height="900" fill="#FBFAFF"/><rect width="1500" height="120" fill="#5645E8"/><text x="54" y="76" class="head">Sheridan Interaction Design — Program overview</text><text x="54" y="175" class="tag">OFFICIAL WEB EXCERPT</text><text x="54" y="205" class="body">The four-year Honours Bachelor teaches students to understand human</text><text x="54" y="253" class="body">behaviour and cognition, decision-making, ethics, accessibility and</text><text x="54" y="301" class="body">inclusive design. Studio work uses Figma, Adobe Creative Cloud,</text><text x="54" y="349" class="body">Unity, microcontrollers, AR/VR, sensors, wearables, 3D printers and</text><text x="54" y="397" class="body">AI.</text><text x="54" y="467" class="body">The curriculum includes research methods, usability, physical</text><text x="54" y="515" class="body">computing, dynamic data, thesis and portfolio projects.</text><line x1="54" y1="760" x2="1446" y2="760" stroke="#D8D0EF" stroke-width="2"/><text x="54" y="800" class="url">Source: https://www.sheridancollege.ca/programs/bachelor-of-interaction-design</text><style>.head{font-family:Arial,sans-serif;font-size:38px;font-weight:700;fill:#fff}.tag{font-family:Arial,sans-serif;font-size:22px;font-weight:700;fill:#5645E8}.body{font-family:Arial,sans-serif;font-size:31px;fill:#202020}.url{font-family:Arial,sans-serif;font-size:20px;fill:#625E76}</style></svg>