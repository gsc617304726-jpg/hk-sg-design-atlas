<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><rect width="1500" height="900" fill="#FBFAFF"/><rect width="1500" height="120" fill="#5645E8"/><text x="54" y="76" class="head">Concordia — Computation Arts BFA</text><text x="54" y="175" class="tag">OFFICIAL WEB EXCERPT</text><text x="54" y="205" class="body">Computation Arts combines design, art and technology. Students take</text><text x="54" y="253" class="body">half of their courses in Computation Arts and half in Computer</text><text x="54" y="301" class="body">Science. The specialization includes New Media Theory, Digital Media</text><text x="54" y="349" class="body">Studio, Creative Computation, Interaction Design Studio and a</text><text x="54" y="397" class="body">Capstone in Prototyping.</text><text x="54" y="467" class="body">The program can lead toward interaction design, gallery-based fine</text><text x="54" y="515" class="body">arts practice and game development.</text><line x1="54" y1="760" x2="1446" y2="760" stroke="#D8D0EF" stroke-width="2"/><text x="54" y="800" class="url">Source: https://www.concordia.ca/academics/undergraduate/computation-arts/.html</text><style>.head{font-family:Arial,sans-serif;font-size:38px;font-weight:700;fill:#fff}.tag{font-family:Arial,sans-serif;font-size:22px;font-weight:700;fill:#5645E8}.body{font-family:Arial,sans-serif;font-size:31px;fill:#202020}.url{font-family:Arial,sans-serif;font-size:20px;fill:#625E76}</style></svg>