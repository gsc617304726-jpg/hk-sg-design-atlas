<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><rect width="1500" height="900" fill="#FBFAFF"/><rect width="1500" height="120" fill="#5645E8"/><text x="54" y="76" class="head">Emily Carr — Interaction Design program structure</text><text x="54" y="175" class="tag">OFFICIAL WEB EXCERPT</text><text x="54" y="205" class="body">This is a four-year Bachelor of Design degree, majoring in</text><text x="54" y="253" class="body">Interaction Design. Students move from a Foundation Year into core</text><text x="54" y="301" class="body">studios, UX sketching and prototyping, 3D modelling, designing for</text><text x="54" y="349" class="body">screens, and design culture.</text><text x="54" y="419" class="body">The program includes courses for emerging technologies and supports</text><text x="54" y="467" class="body">work experience in years three and four.</text><line x1="54" y1="760" x2="1446" y2="760" stroke="#D8D0EF" stroke-width="2"/><text x="54" y="800" class="url">Source: https://ecuad.ca/degree-programs/undergraduate/interaction-design/program-structure/</text><style>.head{font-family:Arial,sans-serif;font-size:38px;font-weight:700;fill:#fff}.tag{font-family:Arial,sans-serif;font-size:22px;font-weight:700;fill:#5645E8}.body{font-family:Arial,sans-serif;font-size:31px;fill:#202020}.url{font-family:Arial,sans-serif;font-size:20px;fill:#625E76}</style></svg>