<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><rect width="1500" height="900" fill="#FBFAFF"/><rect width="1500" height="120" fill="#5645E8"/><text x="54" y="76" class="head">OCAD U Digital Futures — Program overview</text><text x="54" y="175" class="tag">OFFICIAL WEB EXCERPT</text><text x="54" y="205" class="body">You’ll create the technologies that shape the way we live, work, and</text><text x="54" y="253" class="body">play. First year introduces digital and physical design skills.</text><text x="54" y="301" class="body">Years two and three use hands-on Atelier courses in studios and</text><text x="54" y="349" class="body">research labs. Fourth year develops an individual or group thesis</text><text x="54" y="397" class="body">project.</text><text x="54" y="467" class="body">Portfolio and a statement of intent are required for this</text><text x="54" y="515" class="body">undergraduate program.</text><line x1="54" y1="760" x2="1446" y2="760" stroke="#D8D0EF" stroke-width="2"/><text x="54" y="800" class="url">Source: https://admissions.ocadu.ca/program/digital-futures</text><style>.head{font-family:Arial,sans-serif;font-size:38px;font-weight:700;fill:#fff}.tag{font-family:Arial,sans-serif;font-size:22px;font-weight:700;fill:#5645E8}.body{font-family:Arial,sans-serif;font-size:31px;fill:#202020}.url{font-family:Arial,sans-serif;font-size:20px;fill:#625E76}</style></svg>