<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#162d4c"/><stop offset="1" stop-color="#315c82"/></linearGradient></defs><rect width="900" height="540" rx="22" fill="#f8fbfd"/><rect width="900" height="126" rx="22" fill="url(#g)"/><rect y="108" width="900" height="18" fill="#ef7b5b" opacity=".95"/><text x="46" y="54" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">UK DESIGN ATLAS · OFFICIAL SOURCE NOTES</text><text x="46" y="91" fill="#cfe0ed" font-family="Arial,sans-serif" font-size="18">Information Experience Design MA  /  2027 entry evidence extract</text><text x="48" y="181" fill="#20374c" font-family="Arial,sans-serif" font-size="30" font-weight="700">RCA · 信息体验设计</text><line x1="48" y1="205" x2="852" y2="205" stroke="#d5e1ea"/><text x="48" y="260" fill="#51718c" font-family="Arial,sans-serif" font-size="19">围绕信息、媒介和体验构建批判性设计实践，适合想做交互叙事、数字展陈、信息可视化和新型公共体验的学生。…</text><rect x="48" y="302" width="360" height="62" rx="12" fill="#fff0ea"/><text x="70" y="340" fill="#bd4d32" font-family="Arial,sans-serif" font-size="21" font-weight="700">申请判断  必交</text><rect x="432" y="302" width="420" height="62" rx="12" fill="#edf4f7"/><text x="454" y="340" fill="#2d5b76" font-family="Arial,sans-serif" font-size="19">课程关键词  通过studio practice、研究方法、批判性写作和独立项目推进。课程强调从资料组织、叙事结构到交互原型的连续推演。…</text><text x="48" y="430" fill="#778896" font-family="Arial,sans-serif" font-size="16">Source: https://www.rca.ac.uk/study/programme-finder/information-experience-design-ma/</text><text x="48" y="470" fill="#9aa8b1" font-family="Arial,sans-serif" font-size="15">页面为官网内容提取卡 · 申请前请以学校最新页面为准</text></svg>