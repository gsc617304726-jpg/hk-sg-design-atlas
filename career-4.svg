<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#FBFAFF"/><rect x="0" y="0" width="1200" height="150" fill="#5645E8"/><text x="80" y="68" class="eyebrow">CANADA DIGITAL MEDIA CAREER MAP</text><text x="80" y="122" class="head">服务设计师</text><circle cx="1040" cy="92" r="40" fill="#E8E1FF"/><path d="M1022 92h36M1040 74v36" stroke="#5645E8" stroke-width="8" stroke-linecap="round"/><text x="80" y="240" class="body">绘制旅程和服务蓝图，组织共创、试点和跨部门协作。</text><text x="80" y="294" class="body">GBDA商业与设计、SIAT人本设计、Concordia跨学科计算艺术。</text><text x="80" y="348" class="body">旅程图、服务蓝图、利益相关者地图、试点记录与影响指标。</text><line x1="80" y1="610" x2="1120" y2="610" stroke="#D8D0EF" stroke-width="2"/><text x="80" y="655" class="url">课程到岗位的关联分析，基于加拿大本科项目课程与职业任务归纳</text><style>.eyebrow{font-family:Arial,sans-serif;font-size:18px;font-weight:700;letter-spacing:2px;fill:#DBD3FF}.head{font-family:Arial,sans-serif;font-size:36px;font-weight:700;fill:white}.body{font-family:Arial,sans-serif;font-size:28px;fill:#202020}.url{font-family:Arial,sans-serif;font-size:18px;fill:#625E76}</style></svg>