<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><rect width="1500" height="900" fill="#FBFAFF"/><rect width="1500" height="120" fill="#5645E8"/><text x="54" y="76" class="head">OCAD U Digital Futures — Program guide excerpt</text><text x="54" y="175" class="tag">OFFICIAL WEB EXCERPT</text><text x="54" y="205" class="body">Major requirements include Cross-Disciplinary Collaboration, Atelier</text><text x="54" y="253" class="body">0, Physical Computing, Atelier I: Discovery and Atelier II:</text><text x="54" y="301" class="body">Collaboration. Upper-year options include Mobile &amp; Web</text><text x="54" y="349" class="body">Cross-Platform, Intro to Wearable Electronics, XR Space Jam, 2D Game</text><text x="54" y="397" class="body">Design and human-centred research.</text><line x1="54" y1="760" x2="1446" y2="760" stroke="#D8D0EF" stroke-width="2"/><text x="54" y="800" class="url">Source: https://www.ocadu.ca/sites/default/files/2025-06/2025-2026%20DGTF%20Program%20Guide.pdf</text><style>.head{font-family:Arial,sans-serif;font-size:38px;font-weight:700;fill:#fff}.tag{font-family:Arial,sans-serif;font-size:22px;font-weight:700;fill:#5645E8}.body{font-family:Arial,sans-serif;font-size:31px;fill:#202020}.url{font-family:Arial,sans-serif;font-size:20px;fill:#625E76}</style></svg>