<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#162d4c"/><stop offset="1" stop-color="#315c82"/></linearGradient></defs><rect width="900" height="540" rx="22" fill="#f8fbfd"/><rect width="900" height="126" rx="22" fill="url(#g)"/><rect y="108" width="900" height="18" fill="#ef7b5b" opacity=".95"/><text x="46" y="54" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">UK DESIGN ATLAS · OFFICIAL SOURCE NOTES</text><text x="46" y="91" fill="#cfe0ed" font-family="Arial,sans-serif" font-size="18">Design Futures MDes  /  2027 entry evidence extract</text><text x="48" y="181" fill="#20374c" font-family="Arial,sans-serif" font-size="30" font-weight="700">RCA · 设计未来</text><line x1="48" y1="205" x2="852" y2="205" stroke="#d5e1ea"/><text x="48" y="260" fill="#51718c" font-family="Arial,sans-serif" font-size="19">以推测设计、未来情境和系统变革为方法，研究技术、社会与环境变化如何重塑我们共同的未来。适合想做前瞻研究、批判性原型和跨学科创新的学生。…</text><rect x="48" y="302" width="360" height="62" rx="12" fill="#fff0ea"/><text x="70" y="340" fill="#bd4d32" font-family="Arial,sans-serif" font-size="21" font-weight="700">申请判断  必交</text><rect x="432" y="302" width="420" height="62" rx="12" fill="#edf4f7"/><text x="454" y="340" fill="#2d5b76" font-family="Arial,sans-serif" font-size="19">课程关键词  通过未来方法、情境构建、设计研究和studio项目推进，完成从趋势扫描、利益相关者洞察到批判性原型与独立项目的能力链。…</text><text x="48" y="430" fill="#778896" font-family="Arial,sans-serif" font-size="16">Source: https://www.rca.ac.uk/study/programme-finder/design-futures-mdes/</text><text x="48" y="470" fill="#9aa8b1" font-family="Arial,sans-serif" font-size="15">页面为官网内容提取卡 · 申请前请以学校最新页面为准</text></svg>