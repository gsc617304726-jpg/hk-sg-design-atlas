<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><rect width="1500" height="900" fill="#FBFAFF"/><rect width="1500" height="120" fill="#5645E8"/><text x="54" y="76" class="head">SFU SIAT — Undergraduate program</text><text x="54" y="175" class="tag">OFFICIAL WEB EXCERPT</text><text x="54" y="205" class="body">A degree in Interactive Arts and Technology combines the science of</text><text x="54" y="253" class="body">human experience, analysis of media and culture, creation of</text><text x="54" y="301" class="body">original experimental works, and implementation of new technologies.</text><text x="54" y="371" class="body">Concentrations include Creative Media, Designing Interactions,</text><text x="54" y="419" class="body">Extended Reality &amp; Game Design, AI and Data Science for</text><text x="54" y="467" class="body">Human-Centred Systems, and Critical Making.</text><line x1="54" y1="760" x2="1446" y2="760" stroke="#D8D0EF" stroke-width="2"/><text x="54" y="800" class="url">Source: https://www.sfu.ca/siat/programs/undergraduate.html/1000</text><style>.head{font-family:Arial,sans-serif;font-size:38px;font-weight:700;fill:#fff}.tag{font-family:Arial,sans-serif;font-size:22px;font-weight:700;fill:#5645E8}.body{font-family:Arial,sans-serif;font-size:31px;fill:#202020}.url{font-family:Arial,sans-serif;font-size:20px;fill:#625E76}</style></svg>