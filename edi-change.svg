<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#162d4c"/><stop offset="1" stop-color="#315c82"/></linearGradient></defs><rect width="900" height="540" rx="22" fill="#f8fbfd"/><rect width="900" height="126" rx="22" fill="url(#g)"/><rect y="108" width="900" height="18" fill="#ef7b5b" opacity=".95"/><text x="46" y="54" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">UK DESIGN ATLAS · OFFICIAL SOURCE NOTES</text><text x="46" y="91" fill="#cfe0ed" font-family="Arial,sans-serif" font-size="18">Design for Change MA · Edinburgh College of Art  /  2027 entry evidence extract</text><text x="48" y="181" fill="#20374c" font-family="Arial,sans-serif" font-size="30" font-weight="700">Edinburgh · 设计变革</text><line x1="48" y1="205" x2="852" y2="205" stroke="#d5e1ea"/><text x="48" y="260" fill="#51718c" font-family="Arial,sans-serif" font-size="19">以设计作为推动社会、环境与组织变革的工具，关注复杂议题、参与式研究、系统思维和可持续未来。适合想把设计放进真实社会情境的学生。…</text><rect x="48" y="302" width="360" height="62" rx="12" fill="#fff0ea"/><text x="70" y="340" fill="#bd4d32" font-family="Arial,sans-serif" font-size="21" font-weight="700">申请判断  按项目核对</text><rect x="432" y="302" width="420" height="62" rx="12" fill="#edf4f7"/><text x="454" y="340" fill="#2d5b76" font-family="Arial,sans-serif" font-size="19">课程关键词  围绕设计研究、复杂系统、参与式方法、未来情境和独立项目展开，训练从利益相关者洞察到可实施变革方案的完整过程。…</text><text x="48" y="430" fill="#778896" font-family="Arial,sans-serif" font-size="16">Source: https://www.eca.ed.ac.uk/study/postgraduate/masters/design-change</text><text x="48" y="470" fill="#9aa8b1" font-family="Arial,sans-serif" font-size="15">页面为官网内容提取卡 · 申请前请以学校最新页面为准</text></svg>